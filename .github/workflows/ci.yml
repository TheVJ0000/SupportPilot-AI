name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - name: Deterministic RAG evaluation (no external calls)
        run: python -m evals.rag.runner --mode deterministic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build and verify browser bundle contains no server secrets
        run: npm run build
        env:
          SUPABASE_SECRET_KEY: SUPPORTPILOT_CI_SUPABASE_SECRET_MARKER
          GEMINI_API_KEY: SUPPORTPILOT_CI_GEMINI_SECRET_MARKER
          RESEND_API_KEY: SUPPORTPILOT_CI_RESEND_SECRET_MARKER

  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install ".[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
